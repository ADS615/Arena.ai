<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astra 3D: Overdrive Starfighter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #03060f;
      color: #f8fafc;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    #viewport {
      position: relative;
      width: 960px;
      max-width: 98vw;
      aspect-ratio: 16 / 10;
      max-height: 96vh;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: radial-gradient(circle at 50% 35%, #111b38 0%, #050814 65%, #02040a 100%);
      border: 2px solid rgba(56, 189, 248, 0.45);
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(14, 165, 233, 0.25);
      cursor: crosshair;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hud-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .pill {
      background: rgba(6, 10, 22, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }
    .pill span { color: #38bdf8; }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 6, 15, 0.82);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    #overlay.hidden { display: none; }
    .tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 40px;
      font-weight: 900;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      max-width: 460px;
      line-height: 1.55;
      margin-bottom: 22px;
      font-size: 14.5px;
    }
    button {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
      border: none;
      padding: 13px 30px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(14, 165, 233, 0.45);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <canvas id="c" width="960" height="600"></canvas>
    <div class="hud">
      <div class="hud-group">
        <div class="pill">SCORE <span id="score">0</span></div>
        <div class="pill">SECTOR <span id="sector">1</span></div>
        <div class="pill">BEST <span id="best">0</span></div>
      </div>
      <div class="hud-group">
        <div class="pill">HULL <span id="hull">100%</span></div>
        <div class="pill">3D ENGINE <span>AI-BLENDER PBR</span></div>
      </div>
    </div>
    <div id="overlay">
      <span class="tag">POWERED BY ARENA AI-BLENDER 3D ENGINE</span>
      <h1 id="title">ASTRA 3D: OVERDRIVE</h1>
      <p id="desc">Pilot your 3D Interceptor Starfighter using WASD / Arrows (or Mouse). Press SPACE or Click to fire dual plasma cannons, and SHIFT for Hyper-Boost!</p>
      <button id="startBtn">ENGAGE 3D WARP</button>
    </div>
  </div>

  <script type="module">
    import {
      createPresetModel,
      norm3,
      dot3,
      sub3,
      cross3
    } from '../../assets/ai-blender-engine.js';

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const sectorEl = document.getElementById('sector');
    const bestEl = document.getElementById('best');
    const hullEl = document.getElementById('hull');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');
    const startBtn = document.getElementById('startBtn');

    // Load 3D Models generated by our AI-Blender Engine
    const shipMesh = createPresetModel('interceptor-ship');
    const mechMesh = createPresetModel('cyber-mech');
    const crystalMesh = createPresetModel('crystal-cluster');
    const asteroidMesh = createPresetModel('asteroid');

    let best = Number(localStorage.getItem('arena_astra3d_best') || 0);
    bestEl.textContent = best;

    let audioCtx = null;
    function synth(freq = 440, dur = 0.08, type = 'sawtooth', vol = 0.06) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.35), audioCtx.currentTime + dur);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        o.stop(audioCtx.currentTime + dur);
      } catch {}
    }

    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    let mouseDown = false;
    canvas.addEventListener('mousedown', () => { mouseDown = true; });
    window.addEventListener('mouseup', () => { mouseDown = false; });

    const stars = Array.from({ length: 140 }, () => ({
      x: (Math.random() - 0.5) * 40,
      y: (Math.random() - 0.5) * 26,
      z: Math.random() * 45 + 2
    }));

    const state = {
      running: false,
      score: 0,
      sector: 1,
      hull: 100,
      ship: { x: 0, y: -1.2, z: 5.5, roll: 0, pitch: 0, fireCd: 0 },
      lasers: [],
      enemies: [],
      particles: [],
      spawnCd: 0
    };

    function startGame() {
      state.running = true;
      state.score = 0;
      state.sector = 1;
      state.hull = 100;
      state.ship = { x: 0, y: -1.2, z: 5.5, roll: 0, pitch: 0, fireCd: 0 };
      state.lasers = [];
      state.enemies = [];
      state.particles = [];
      overlay.classList.add('hidden');
      synth(620, 0.14, 'triangle', 0.09);
    }

    startBtn.addEventListener('click', startGame);

    function project3D(wx, wy, wz) {
      const fov = 560;
      const z = Math.max(0.3, wz);
      const scale = fov / z;
      return [canvas.width / 2 + wx * scale, canvas.height / 2 - wy * scale, z, scale];
    }

    function drawMesh3D(mesh, pos, rot, scaleFactor, baseRgb, emRgb) {
      const [px, py, pz] = pos;
      const [rx, ry, rz] = rot;
      const cx = Math.cos(rx), sx = Math.sin(rx);
      const cy = Math.cos(ry), sy = Math.sin(ry);
      const cz = Math.cos(rz), sz = Math.sin(rz);

      const transformed = mesh.vertices.map(([vx, vy, vz]) => {
        let x = vx * scaleFactor;
        let y = vy * scaleFactor;
        let z = vz * scaleFactor;

        let y1 = y * cx - z * sx, z1 = y * sx + z * cx;
        y = y1; z = z1;
        let x2 = x * cy + z * sy, z2 = -x * sy + z * cy;
        x = x2; z = z2;
        let x3 = x * cz - y * sz, y3 = x * sz + y * cz;
        x = x3; y = y3;

        const world = [x + px, y + py, z + pz];
        const proj = project3D(world[0], world[1], world[2]);
        return { world, proj };
      });

      const light = norm3([0.4, 0.8, -0.5]);
      const tris = [];
      for (const [i0, i1, i2] of mesh.faces) {
        const a = transformed[i0];
        const b = transformed[i1];
        const c = transformed[i2];
        if (!a || !b || !c) continue;
        if (a.proj[2] < 0.5 || b.proj[2] < 0.5 || c.proj[2] < 0.5) continue;
        const depth = (a.proj[2] + b.proj[2] + c.proj[2]) / 3;
        const n = norm3(cross3(sub3(b.world, a.world), sub3(c.world, a.world)));
        tris.push({ a, b, c, depth, n });
      }
      tris.sort((t1, t2) => t2.depth - t1.depth);

      for (const t of tris) {
        const ndl = Math.max(0.18, Math.abs(dot3(t.n, light)));
        const spec = Math.pow(ndl, 14) * 90;
        const r = Math.min(255, Math.round(baseRgb[0] * ndl + emRgb[0] * 0.25 + spec));
        const g = Math.min(255, Math.round(baseRgb[1] * ndl + emRgb[1] * 0.25 + spec));
        const b = Math.min(255, Math.round(baseRgb[2] * ndl + emRgb[2] * 0.25 + spec));

        ctx.beginPath();
        ctx.moveTo(t.a.proj[0], t.a.proj[1]);
        ctx.lineTo(t.b.proj[0], t.b.proj[1]);
        ctx.lineTo(t.c.proj[0], t.c.proj[1]);
        ctx.closePath();
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fill();
      }
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      const boost = keys['ShiftLeft'] || keys['ShiftRight'] ? 1.85 : 1.0;

      if (state.running) {
        const s = state.ship;
        let vx = 0, vy = 0;
        if (keys['KeyA'] || keys['ArrowLeft']) vx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) vx += 1;
        if (keys['KeyW'] || keys['ArrowUp']) vy += 1;
        if (keys['KeyS'] || keys['ArrowDown']) vy -= 1;

        s.x = Math.max(-4.8, Math.min(4.8, s.x + vx * 7.5 * dt));
        s.y = Math.max(-3.0, Math.min(2.6, s.y + vy * 6.0 * dt));
        s.roll += (-vx * 0.55 - s.roll) * 10 * dt;
        s.pitch += (vy * 0.3 - s.pitch) * 10 * dt;
        s.fireCd -= dt;

        if ((keys['Space'] || mouseDown) && s.fireCd <= 0) {
          s.fireCd = 0.13;
          state.lasers.push(
            { x: s.x - 0.55, y: s.y, z: s.z + 1.2 },
            { x: s.x + 0.55, y: s.y, z: s.z + 1.2 }
          );
          synth(720, 0.05, 'sawtooth', 0.04);
        }

        // Update lasers
        for (let i = state.lasers.length - 1; i >= 0; i--) {
          const l = state.lasers[i];
          l.z += 42 * dt;
          if (l.z > 48) state.lasers.splice(i, 1);
        }

        // Spawn 3D enemies & obstacles
        state.spawnCd -= dt * boost;
        if (state.spawnCd <= 0) {
          state.spawnCd = Math.max(0.32, 0.95 - state.sector * 0.06);
          const rollType = Math.random();
          const type = rollType < 0.35 ? 'mech' : rollType < 0.55 ? 'crystal' : 'asteroid';
          state.enemies.push({
            type,
            x: (Math.random() - 0.5) * 9.2,
            y: (Math.random() - 0.5) * 5.2,
            z: 44,
            rx: Math.random() * 3,
            ry: Math.random() * 3,
            hp: type === 'mech' ? 3 : 2
          });
        }

        // Update enemies
        for (let i = state.enemies.length - 1; i >= 0; i--) {
          const e = state.enemies[i];
          e.z -= (13 + state.sector * 1.4) * boost * dt;
          e.ry += 1.4 * dt;
          if (e.type === 'asteroid') e.rx += 1.1 * dt;

          // Check collision with ship
          if (Math.abs(e.z - s.z) < 1.3 && Math.hypot(e.x - s.x, e.y - s.y) < 1.35) {
            if (e.type === 'crystal') {
              state.score += 50;
              state.hull = Math.min(100, state.hull + 15);
              synth(920, 0.12, 'sine', 0.08);
            } else {
              state.hull -= 25;
              synth(130, 0.2, 'sawtooth', 0.1);
              if (state.hull <= 0) {
                state.hull = 0;
                state.running = false;
                if (state.score > best) {
                  best = state.score;
                  localStorage.setItem('arena_astra3d_best', String(best));
                  bestEl.textContent = best;
                }
                titleEl.textContent = 'STARFIGHTER DOWN';
                descEl.textContent = `Final Score: ${state.score} (Sector ${state.sector}) — Best: ${best}`;
                startBtn.textContent = 'RELAUNCH 3D MISSION';
                overlay.classList.remove('hidden');
              }
            }
            state.enemies.splice(i, 1);
            continue;
          }

          // Laser hits
          for (let j = state.lasers.length - 1; j >= 0; j--) {
            const l = state.lasers[j];
            if (Math.abs(l.z - e.z) < 1.8 && Math.hypot(l.x - e.x, l.y - e.y) < 1.35) {
              state.lasers.splice(j, 1);
              e.hp -= 1;
              if (e.hp <= 0) {
                state.score += e.type === 'mech' ? 40 : 20;
                state.sector = 1 + Math.floor(state.score / 250);
                synth(290, 0.09, 'square', 0.06);
                for (let p = 0; p < 14; p++) {
                  state.particles.push({
                    x: e.x, y: e.y, z: e.z,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    vz: (Math.random() - 0.5) * 10,
                    life: 0.45
                  });
                }
                state.enemies.splice(i, 1);
              }
              break;
            }
          }

          if (e.z < 1.0) state.enemies.splice(i, 1);
        }

        // Update particles
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const pt = state.particles[i];
          pt.x += pt.vx * dt;
          pt.y += pt.vy * dt;
          pt.z += pt.vz * dt;
          pt.life -= dt;
          if (pt.life <= 0) state.particles.splice(i, 1);
        }

        scoreEl.textContent = state.score;
        sectorEl.textContent = state.sector;
        hullEl.textContent = `${state.hull}%`;
      }

      // Render 3D scene
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 3D Starfield
      ctx.fillStyle = '#bae6fd';
      for (const st of stars) {
        st.z -= 18 * boost * dt;
        if (st.z < 1) st.z = 45;
        const [sx, sy, , sc] = project3D(st.x, st.y, st.z);
        const r = Math.max(0.8, Math.min(3.0, sc * 0.015));
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Render enemies back-to-front
      const sortedEnemies = [...state.enemies].sort((a, b) => b.z - a.z);
      for (const e of sortedEnemies) {
        if (e.type === 'mech') {
          drawMesh3D(mechMesh, [e.x, e.y, e.z], [0.2, e.ry, 0], 0.65, [168, 85, 247], [244, 63, 94]);
        } else if (e.type === 'crystal') {
          drawMesh3D(crystalMesh, [e.x, e.y, e.z], [0, e.ry, 0], 0.6, [34, 211, 238], [56, 189, 248]);
        } else {
          drawMesh3D(asteroidMesh, [e.x, e.y, e.z], [e.rx, e.ry, 0], 0.72, [148, 163, 184], [30, 41, 59]);
        }
      }

      // Render lasers
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      for (const l of state.lasers) {
        const p1 = project3D(l.x, l.y, l.z);
        const p2 = project3D(l.x, l.y, l.z + 1.8);
        ctx.beginPath();
        ctx.moveTo(p1[0], p1[1]);
        ctx.lineTo(p2[0], p2[1]);
        ctx.stroke();
      }

      // Render 3D Particles
      for (const pt of state.particles) {
        const [px, py] = project3D(pt.x, pt.y, pt.z);
        ctx.fillStyle = `rgba(250, 204, 21, ${Math.max(0, pt.life * 2)})`;
        ctx.beginPath();
        ctx.arc(px, py, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Render Player 3D Interceptor Starfighter
      const s = state.ship;
      drawMesh3D(
        shipMesh,
        [s.x, s.y, s.z],
        [s.pitch, Math.PI, s.roll],
        0.55,
        [56, 189, 248],
        [14, 165, 233]
      );

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
